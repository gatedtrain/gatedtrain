# Tier B fixture spec (prototype, unpromotable). A strict
# subset of the 04 section 3 grammar. Rendered by tests/_tierb.py:
# {registration_sha256} is the SHA-256 of the rendered registration.yaml.
workflow: tierb-fixture
version: 1
budget: {gpu_hours: 8}
artifacts:
  base:         {type: model_checkpoint, uri: "file:base-model"}
  train:        {type: training_dataset, uri: "file:export/train"}
  heldout:      {type: prompt_dataset, uri: "file:export/heldout", disjoint_from: [train]}
  trainer_cfg:  {type: trainer_config, uri: "file:trainer.yaml"}
  registration: {type: registration, uri: "file:registration.yaml@sha256:{registration_sha256}"}
stages:
  - id: rl
    uses: rl.nemo_rl@0.1
    algorithm: grpo
    model_family: llm.qwen3@0.1
    inputs: {model: base, data: train, config: trainer_cfg}
    outputs: {model: rl_ckpt}
  - id: quality_gate
    uses: gate.superiority@1.0
    evaluator: gsm8k.nemo_evaluator@0.1
    sampler: deployment
    inputs: {model: rl_ckpt, baseline: base, prompts: heldout, registration: registration}
    test: {metric: reward, alpha: 0.025, power: 0.80, mde: 0.30, cluster_by: prompt, seeds: 2}
    on_fail: stop
    owner: skeleton-demo
    escalation: [skeleton-demo-lead]
