# Run the test suite on every push and pull request, on CPU, with the design set checked out for the tests that
# read it. Tests that need NeMo RL or NeMo Evaluator clones or a GPU host's records skip (README "Tests").
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The design revision this version implements (README "Design references"), outside the checkout.
      - run: git clone --quiet --depth 1 --branch rev-19 https://github.com/gatedtrain/gatedtrain-design "$RUNNER_TEMP/gatedtrain-design"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[tier-a]'
      # The CPU model and instruction sets of the runner, to match a demo result with the hardware it ran on.
      - run: grep -m1 'model name' /proc/cpuinfo; grep -o -m1 -w -E 'avx512f|avx2' /proc/cpuinfo | sort -u
      # The launch rules require a run's output directory to be owned by the container's uid 1000 (EXT-63); the
      # runner's user is another uid, so the tests run as uid 1000.
      - run: id -u 1000 > /dev/null 2>&1 || sudo useradd --uid 1000 --create-home gatedtrain-test
      - run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"
      - run: sudo chmod a+x "$HOME" "$(dirname "$GITHUB_WORKSPACE")" "$(dirname "$(dirname "$GITHUB_WORKSPACE")")"
      - run: sudo -u '#1000' -H env "PATH=$PATH" "GATEDTRAIN_DESIGN_DIR=$GATEDTRAIN_DESIGN_DIR" python -m unittest discover -s tests -t tests
        env:
          GATEDTRAIN_DESIGN_DIR: ${{ runner.temp }}/gatedtrain-design
