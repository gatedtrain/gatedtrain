# Run the test suite on every push and pull request, on CPU, with the design set checked out for the tests that
# read it. Tests that need NeMo RL or NeMo Evaluator clones or a GPU host's records skip (README "Tests").
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The design revision this version implements (README "Design references"), outside the checkout.
      - run: git clone --quiet --depth 1 --branch rev-19 https://github.com/gatedtrain/gatedtrain-design "$RUNNER_TEMP/gatedtrain-design"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[tier-a]'
      # The keeper refuses to start when a file it runs, or a directory above one, is writable by group or other
      # (AN-13). The toolcache Python and the checkout belong to the runner user, so it clears those bits without sudo;
      # the second step lists what is still open (at most 20 lines) and never fails on its own.
      - run: chmod -R go-w "$pythonLocation" "$GITHUB_WORKSPACE"
      - run: >-
          python -c "import os; from gatedtrain.ainative.keeper import envcheck as e;
          [print(p.line()) for p in e.path_problems(e.keeper_code_paths(), os.getuid())[:20]]"
      # The CPU model and instruction sets of the runner, to match a demo result with the hardware it ran on.
      - run: grep -m1 'model name' /proc/cpuinfo; grep -o -m1 -w -E 'avx512f|avx2' /proc/cpuinfo | sort -u
      # As the runner user: the launch fixtures run the container as the user running the tests (EXT-63). That user
      # must be able to launch one (non-root, its primary group owning no Docker socket); the tests that need it fail
      # rather than skip when it cannot (GATEDTRAIN_REQUIRE_CONTAINER_USER).
      - run: id
      - run: python -m unittest discover -s tests -t tests
        env:
          GATEDTRAIN_DESIGN_DIR: ${{ runner.temp }}/gatedtrain-design
          GATEDTRAIN_REQUIRE_CONTAINER_USER: "1"
