# The synthetic scenario pack's pipeline: a toy task "map an input string to its label" whose model is a lookup table.
# The five trust stages run in their fixed order around the pack's pluggable stages. `train` declares the `gpu` need
# (so the order rule applies to it) but runs on the CPU.
name: synthetic-lookup
stages:
  - {name: intake_seal, stage: intake_seal}
  - {name: profile_data, stage: profile_data,
     inputs: {train_part: intake_seal.train_part}}
  - {name: choose_task_and_base, stage: choose_task_and_base,
     inputs: {profile: profile_data.profile}}
  - {name: preregister, stage: preregister,
     inputs: {sealed_summary: intake_seal.sealed_summary, deployment: choose_task_and_base.deployment,
              base_model: choose_task_and_base.base}}
  - {name: build_train_set, stage: build_train_set,
     inputs: {train_part: intake_seal.train_part}}
  - {name: write_recipe, stage: write_recipe, params: {noise: 0.0},
     inputs: {train_set: build_train_set.train_set}}
  - {name: smoke, stage: smoke,
     inputs: {train_set: build_train_set.train_set, recipe: write_recipe.recipe}}
  - {name: train, stage: train,
     inputs: {train_set: build_train_set.train_set, recipe: write_recipe.recipe, smoke: smoke.smoke}}
  - {name: evaluate_sealed, stage: evaluate_sealed,
     inputs: {registration: preregister.registration, baseline_model: choose_task_and_base.base,
              candidate_model: train.model}}
  - {name: gate, stage: gate,
     inputs: {registration: preregister.registration, baseline_records: evaluate_sealed.baseline_records,
              candidate_records: evaluate_sealed.candidate_records}}
  - {name: report, stage: report,
     inputs: {registration: preregister.registration, power: intake_seal.power, gate_result: gate.gate_result}}
