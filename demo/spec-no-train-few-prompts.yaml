# Negative control: no training on too few prompts (MVP review follow-up,
# end-to-end INCONCLUSIVE). lr = 0 leaves the model unchanged, so nothing is
# rejected; the 30-prompt set is below the planned n = 172, so the run is
# underpowered and the gate must be INCONCLUSIVE (05:82), exit code 1.
# prototype, unpromotable.
workflow: skeleton-addition-demo-no-train-few-prompts
version: 1
budget: {gpu_hours: 0}
artifacts:
  base:         {type: model_checkpoint, uri: "file:baseline"}
  train:        {type: training_dataset, uri: "file:data/train"}
  heldout:      {type: prompt_dataset, uri: "file:data/heldout-small", disjoint_from: [train]}
  trainer_cfg:  {type: trainer_config, uri: "file:trainer-lr0.yaml"}
  registration: {type: registration, uri: "file:registration-few-prompts.yaml@sha256:0a321acf8517cfc28ece0d82e850f48624f99b3661a13c7b7cf0de35809dabe3"}
stages:
  - id: sft
    uses: sft.cpu_stub@0.1
    algorithm: sft
    model_family: llm.char_transformer@0.1
    inputs: {model: base, data: train, config: trainer_cfg}
    outputs: {model: sft_ckpt}
  - id: quality_gate
    uses: gate.superiority@1.0
    evaluator: addition_em.cpu_stub@0.1
    sampler: deployment
    inputs: {model: sft_ckpt, baseline: base, prompts: heldout, registration: registration}
    test: {metric: exact_match, alpha: 0.025, power: 0.80, mde: 0.10, cluster_by: prompt, seeds: 4}
    on_fail: stop
    owner: skeleton-demo
    escalation: [skeleton-demo-lead]
