# The documentation site, published to GitHub Pages by .github/workflows/docs.yml. It is built from the pages under
# docs/ plus README.md (the home page) and CHANGELOG.md, added by mkdocs_hooks.py, which also rewrites links written
# for GitHub. Build locally with: pip install -r requirements-docs.txt; mkdocs serve
site_name: gatedtrain
site_description: Decide whether a newly trained checkpoint really is better, by rules fixed before training.
site_url: https://gatedtrain.github.io/gatedtrain/
repo_url: https://github.com/gatedtrain/gatedtrain
repo_name: gatedtrain/gatedtrain
edit_uri: ""
docs_dir: docs
hooks:
  - mkdocs_hooks.py
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/brightness-7, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/brightness-4, name: Light mode}
markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Concepts: concepts.md
  - Try it: quickstart.md
  - Guides:
      - External training runs: external-runs.md
      - AI-native projects: ai-native.md
  - Reference:
      - Commands: commands.md
      - Configuration: configuration.md
      - Development: development.md
      - Changelog: changelog.md
  - Background:
      - GPU step: gpu-step.md
      - Tier B runbook: tier-b-runbook.md
      - Findings: findings.md
